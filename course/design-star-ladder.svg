<text x="36" y="450" text-anchor="start" font-size="11" font-weight="400" fill="#2b2b2b">① 门槛只能取「最少通关发数 M」：「通关」这个词本身占掉一条判据，所以阈值不是能单独拧的旋钮 —— 想调三星率，只能调摆放（改 M）或调额度（改 B）。</text>
<text x="36" y="464" text-anchor="start" font-size="11" font-weight="400" fill="#2b2b2b">② 左边的色条：青绿 = 额度留了 ≥1 发余量；朱砂 = 额度只剩「最少发数」本身（那种关里二星档事实上消失）。</text>
<text x="36" y="476" text-anchor="start" font-size="11" font-weight="400" fill="#2b2b2b">③ 路线占比 = 通关路线的构成（几何）；实测基准率 = 8000 条随机路线里拿到三星的比例（玩家）。两个数不一样，看后者。</text>
