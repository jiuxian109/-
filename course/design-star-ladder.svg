<text x="38" y="109" text-anchor="start" font-size="10.5" font-weight="400" fill="#5a5750">三星 = 用 ≤4 发（剩 ≥2 只）。教学关，容错 2 发；二星是保底档</text>
<text x="38" y="124" text-anchor="start" font-size="10.5" font-weight="400" fill="#5a5750">路线占比 57.1% 偏高，但玩家基准率 36.3% 落在带内 —— 教学关这样刚好</text>
