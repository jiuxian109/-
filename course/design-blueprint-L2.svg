<text x="54" y="644" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂虚线 = 主弹道 ｜ 墨灰点线 = 备选</text>
<rect x="24" y="649" width="22" height="14" fill="#faf5e8" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="54" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂批注 = 当前有缺陷，需修</text>
<text x="468" y="560" text-anchor="start" font-size="11" font-weight="700" fill="#5a5750" letter-spacing="1.5">这一关怎么打</text>
<text x="468" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#5a5750">主塔不倒，顶上的落印块永远够不着；右台是一块厚板，平射整条走廊被它堵住</text>
<text x="468" y="596" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第一发 · 直击护心：护心块压在最底层：连锁对它无效，只能奶龙自己撞上去</text>
<text x="482" y="612" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 1：170° 拉满 → (1005, 382)</text>
<text x="468" y="628" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第二发 · 拆塔身：护心块一倒，上面五层连同塔顶落印块一起塌</text>
<text x="482" y="644" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 2：165° 拉满 → (998, 325)</text>
<text x="468" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第三发 · 高抛右台：右台台面高过平射走廊：只能高抛，落点窗口只有个位数</text>
<text x="482" y="676" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 3：125° 拉满 → (1010, -95)</text>
<text x="468" y="676" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">弹道是离线仿真积分（重力 0.001、空气阻力 0.008、60Hz），只画到第一块木块之前。</text>
<text x="468" y="692" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">撞击之后的连锁要自己想象；图上的角度是「一个能打到」的例子，不是唯一解。</text>
