<text x="54" y="612" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">赭木 + 墨圈 = 护心块（免疫连锁）</text>
<rect x="24" y="617" width="22" height="14" fill="#b23a2e" stroke="#7f2a21" stroke-width="1.5"/>
<text x="35" y="627" text-anchor="middle" font-size="9" font-weight="400" fill="#faf5e8">印</text>
<text x="54" y="628" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂实心 = 落印块（需压平 / 掀翻）</text>
