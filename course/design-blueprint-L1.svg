<text x="14" y="23" text-anchor="start" font-size="17" font-weight="700" fill="#2b2b2b" letter-spacing="0.5">第 1 关 · 云间初试（教学关）</text>
<text x="956" y="23" text-anchor="end" font-size="12" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">960×540 · 木块 8 · 奶龙 6</text>
<text x="250" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="#2b2b2b">新手塔：打下半段，整座一起塌</text>
<text x="630" y="290" text-anchor="start" font-size="12" font-weight="400" fill="#2b2b2b">连锁源 + 护心块（墨圈）</text>
<text x="360" y="150" text-anchor="start" font-size="12" font-weight="400" fill="#2b2b2b">空放一发也能学：拉不到死区线松手不扣发数</text>
<line x1="0" y1="540" x2="960" y2="540" stroke="#2b2b2b" stroke-width="1" opacity="0.45"/>
<text x="24" y="560" text-anchor="start" font-size="11" font-weight="700" fill="#5a5750" letter-spacing="1.5">图例 / LEGEND</text>
<rect x="24" y="570" width="22" height="12" fill="#e7efe6" stroke="#4e7a5e" stroke-width="1.25"/>
<line x1="24" y1="570" x2="46" y2="570" stroke="#4e7a5e" stroke-width="2.5"/>
<text x="54" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">青绿 = 岛体（岛面线 / 岛身）</text>
<rect x="24" y="585" width="22" height="14" fill="#fbeee0" stroke="#2b2b2b" stroke-width="1"/>
<text x="54" y="596" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">赭木 + 墨框 = 普通木块 44×44</text>
<rect x="24" y="601" width="22" height="14" fill="#fbeee0" stroke="#b98247" stroke-width="2"/>
<circle cx="35" cy="608" r="4" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<text x="54" y="612" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">赭木 + 墨圈 = 护心块（免疫连锁）</text>
<rect x="24" y="617" width="22" height="14" fill="#b23a2e" stroke="#7f2a21" stroke-width="1.5"/>
<text x="35" y="627" text-anchor="middle" font-size="9" font-weight="400" fill="#faf5e8">印</text>
<text x="54" y="628" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂实心 = 落印块（需压平 / 掀翻）</text>
<line x1="24" y1="636" x2="46" y2="636" stroke="#b23a2e" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="24" y1="645" x2="46" y2="645" stroke="#5a5750" stroke-width="1.25" stroke-dasharray="3 5"/>
<text x="54" y="644" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂虚线 = 主弹道 ｜ 墨灰点线 = 备选</text>
<rect x="24" y="649" width="22" height="14" fill="#faf5e8" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="54" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂批注 = 当前有缺陷，需修</text>
<text x="468" y="560" text-anchor="start" font-size="11" font-weight="700" fill="#5a5750" letter-spacing="1.5">这一关怎么打</text>
<text x="468" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#5a5750">三座岛就是三站课：新手塔（打底不打顶）→ 连锁源 + 护心块 → 落印块</text>
<text x="468" y="596" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第一发 · 打底：撞塔的下半段，整座三层塔一起塌（塔尖单独掉不算）</text>
<text x="482" y="612" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 1：165° 拉满 → (990, 311)</text>
<text x="468" y="628" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第二发 · 连锁：打那座二层塔，让它塌向护心块 —— 护心块纹丝不动</text>
<text x="482" y="644" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 2：157° 拉满 → (1002, 214)</text>
<text x="468" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第三发 · 落印：高抛打右上那块落印（朱砂实心）：平推只滑不算，要压翻或掀下台子</text>
<text x="482" y="676" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 3：146° 拉满 → (1007, 74)</text>
<text x="468" y="676" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">弹道是离线仿真积分（重力 0.001、空气阻力 0.008、60Hz），只画到第一块木块之前。</text>
<text x="468" y="692" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">撞击之后的连锁要自己想象；图上的角度是「一个能打到」的例子，不是唯一解。</text>
</svg>