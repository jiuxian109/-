<text x="14" y="23" text-anchor="start" font-size="17" font-weight="700" fill="#2b2b2b" letter-spacing="0.5">第 3 关 · 一柱擎天（六层柱）</text>
<text x="956" y="23" text-anchor="end" font-size="12" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">960×540 · 木块 10 · 奶龙 6</text>
<text x="398" y="300" text-anchor="end" font-size="12" font-weight="400" fill="#2b2b2b">柱脚绊块：先把它顶开</text>
<text x="452" y="390" text-anchor="end" font-size="12" font-weight="400" fill="#2b2b2b">护心柱脚（墨圈）：只能直击</text>
<text x="710" y="158" text-anchor="start" font-size="12" font-weight="400" fill="#2b2b2b">顶檐 48×28 也是护心块</text>
<text x="530" y="142" text-anchor="start" font-size="12" font-weight="400" fill="#2b2b2b">六层柱：中间两层只有少数角度打得到</text>
