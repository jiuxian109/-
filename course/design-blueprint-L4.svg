<text x="54" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">朱砂批注 = 当前有缺陷，需修</text>
<text x="468" y="560" text-anchor="start" font-size="11" font-weight="700" fill="#5a5750" letter-spacing="1.5">这一关怎么打</text>
<text x="468" y="580" text-anchor="start" font-size="11.5" font-weight="400" fill="#5a5750">三台递进：平地双塔 + 护心 → 浮岛落印 → 最高岛只能高抛。最少 4 发，额度 7 发</text>
<text x="468" y="596" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第一发 · 平地：护心块贴在岛左缘，是全场最宽的直击窗口，也是拦在双塔前面的路障</text>
<text x="482" y="612" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 1：168° 拉满 → (1000, 353)</text>
<text x="468" y="628" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第二发 · 中层浮岛：左缘二层塔 + 一块落印；先把塔推倒，落印才露出来</text>
<text x="482" y="644" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 2：150° 拉满 → (992, 113)</text>
<text x="468" y="660" text-anchor="start" font-size="11.5" font-weight="400" fill="#2b2b2b">第三发 · 最高岛：只能高抛，且要越过中岛的塔顶；落印与普通块各一</text>
<text x="482" y="676" text-anchor="start" font-size="10" font-weight="400" fill="#5a5750" font-family="'Cascadia Mono',Consolas,'Courier New',monospace">弹道 3：122° 拉满 → (1006, -132)</text>
<text x="468" y="676" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">弹道是离线仿真积分（重力 0.001、空气阻力 0.008、60Hz），只画到第一块木块之前。</text>
<text x="468" y="692" text-anchor="start" font-size="9.5" font-weight="400" fill="#5a5750">撞击之后的连锁要自己想象；图上的角度是「一个能打到」的例子，不是唯一解。</text>
</svg>