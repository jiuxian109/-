<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DDD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<!-- 触屏按钮条（桌面端由 CSS 隐藏；手机上替代画布右上角的三个小芯片） -->
<div id="touchBar">
  <button id="tbMute" class="tbtn" title="音效开关">🔊</button>
  <button id="tbFull" class="tbtn" title="全屏">⛶</button>
  <button id="tbRestart" class="tbtn" title="重来">↻</button>
  <button id="tbSelect" class="tbtn" title="选关">☰</button>
</div>

<!-- 竖屏游玩时的信息条：竖屏画面只有屏幕宽度的 2/5，画布上的字看不清，把信息搬到下面的操作区 -->
<div id="pvInfo"></div>

<!-- 开始界面 -->
<div id="startOverlay" class="overlay">
  <div class="panel">
    <div class="title">DDD</div>
    <div class="sub">拖住奶龙头往后拉，松手发射</div>
    <div class="sub">拖动弹弓的叉尖或手柄，可以在发射台上左右移位</div>
    <div class="sub">把堆叠的木块全部击倒，即可通关！</div>
    <div class="hint">共 4 关 · 关卡递进 · 评分星级</div>
    <button id="startBtn" class="btn">▶ 开始游戏</button>
    <button id="selectBtn" class="btn small ghost">☰ 选关</button>
    <button id="fsBtn" class="btn small ghost">⛶ 全屏</button>
  </div>
</div>

<!-- 过关界面 -->
<div id="levelOverlay" class="overlay hidden">
  <div class="panel">
    <div class="title" id="levelTitle">第 1 关 通过！</div>
    <div class="stars" id="levelStars">
      <span class="on">★</span><span class="off">★</span><span class="off">★</span>
    </div>
    <div class="sub" id="levelScore">得分 0</div>
    <button id="nextBtn" class="btn">▶ 下一关</button>
    <button id="replayLevelBtn" class="btn small ghost">🔄 重玩本关</button>
  </div>
</div>

<!-- 失败界面 -->
<div id="loseOverlay" class="overlay hidden shake">
  <div class="panel">
    <div class="title">😢 差一点</div>
    <div class="sub">木块没有全部击倒</div>
    <button id="retryBtn" class="btn">🔄 再来一次</button>
  </div>
</div>

<!-- 选关界面 -->
<div id="selectOverlay" class="overlay hidden">
  <div class="panel wide">
    <div class="title">选择关卡</div>
    <div class="hint">通关一关才会解锁下一关</div>
    <div id="levelList" class="level-list"></div>
    <button id="selectClose" class="btn small ghost">✕ 返回</button>
  </div>
</div>

<!-- 视频小窗 -->
<div id="videoOverlay" class="overlay hidden">
  <div class="popup" id="popup">
    <div class="popup-title" id="popupDrag">🏆 全部通关！</div>
    <button class="popup-close" id="popupClose" title="关闭">✕</button>
    <div class="video-wrap">
      <video id="winVideo" src="assets/video_20261012_175751.mp4" controls playsinline preload="auto"></video>
      <div id="playHint" class="hidden"><span>▶ 点击播放</span></div>
    </div>
    <div class="popup-actions">
      <button id="replayBtn" class="btn small">🔄 从头开始</button>
    </div>
  </div>
</div>

<!-- 竖屏提示（只在「触屏 + 竖屏」时盖在最上层） -->
<div id="rotateOverlay">
  <div class="rot-icon">📱</div>
  <div class="rot-text">请把手机横过来</div>
  <div class="rot-sub">这个游戏是 16:9 横向的，横屏才有足够的操作空间</div>
  <button id="portraitPlay" class="rot-play">仍要竖屏玩</button>
</div>

<script src="lib/matter.min.js"></script>
<!-- 关卡数据（纯数据，改木块摆放只动这个文件；必须排在 game.js 前面） -->
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
