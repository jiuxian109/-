<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DDD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------------------------------------------------------------------------
     图标库。全站一个 emoji 都不用：
     彩色 emoji 是系统字体，在 Windows 上是蓝灰的 3D 方块字，混在墨色界面里
     是全书最刺眼的一处「不属于这里」。这里每个图标都是 24×24 的线性描边，
     颜色跟着 currentColor 走，所以按钮什么色、图标就是什么色。
     --------------------------------------------------------------------------- -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2 19 12 8 18.8Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3.2 12a8.8 8.8 0 1 0 2.7-6.4"/><path d="M3 4.4V10h5.6"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19Z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.6 5.4a9.4 9.4 0 0 1 0 13.2"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19Z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8.2 10.5V7.4a3.8 3.8 0 0 1 7.6 0v3.1"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3 14.12 9.09 20.56 9.22 15.42 13.11 17.29 19.28 12 15.6 6.71 19.28 8.58 13.11 3.44 9.22 9.88 9.09Z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M10.6 5.4h2.8"/></symbol>
</svg>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<!-- 触屏按钮条（桌面端由 CSS 隐藏；手机上替代画布右上角那四枚小芯片）。
     横屏时它排在画布下方，竖屏时贴在屏幕底部 —— 两种状态共用 CSS 里同一处定义。 -->
<div id="touchBar">
  <button id="tbMute" class="tbtn" type="button" aria-label="音效开关"></button>
  <button id="tbFull" class="tbtn" type="button" aria-label="全屏"></button>
  <button id="tbRestart" class="tbtn" type="button" aria-label="重来"></button>
  <button id="tbSelect" class="tbtn" type="button" aria-label="选关"></button>
</div>

<!-- 竖屏游玩时的信息条：竖屏画面只有屏幕宽度的 2/5，画布上的字看不清，把信息搬到下面的操作区 -->
<div id="pvInfo"></div>

<!-- 开始界面 -->
<div id="startOverlay" class="overlay">
  <div class="panel">
    <div class="title">DDD</div>
    <div class="sub">拖住奶龙头往后拉，松手发射</div>
    <div class="sub">拖动弹弓的叉尖或手柄，可以在发射台上左右移位</div>
    <div class="sub">把堆叠的木块全部击倒，即可通关！</div>
    <div class="hint">共 4 关 · 关卡递进 · 评分星级</div>
    <button id="startBtn" class="btn" type="button"><svg class="ico solid"><use href="#i-play"/></svg><span>开始游戏</span></button>
    <button id="selectBtn" class="btn small ghost" type="button"><svg class="ico"><use href="#i-menu"/></svg><span>选关</span></button>
    <button id="fsBtn" class="btn small ghost" type="button"><svg class="ico"><use href="#i-expand"/></svg><span>全屏</span></button>
  </div>
</div>

<!-- 过关界面 -->
<div id="levelOverlay" class="overlay hidden">
  <div class="panel">
    <div class="title" id="levelTitle">第 1 关 通过！</div>
    <div class="stars" id="levelStars"></div>
    <div class="sub" id="levelScore">得分 0</div>
    <!-- 这个按钮的文字和图标都是过关时才由脚本填进去的，在那之前它是个空按钮。
         aria-label 让它在任何时刻都有可访问名 —— 否则读屏用户和静态检查
         都只看到一个没有名字的按钮。 -->
    <button id="nextBtn" class="btn" type="button" aria-label="下一关"></button>
    <button id="replayLevelBtn" class="btn small ghost" type="button"><svg class="ico"><use href="#i-restart"/></svg><span>重玩本关</span></button>
  </div>
</div>

<!-- 失败界面 -->
<div id="loseOverlay" class="overlay hidden shake">
  <div class="panel">
    <div class="title">差一点</div>
    <div class="sub">木块没有全部击倒</div>
    <button id="retryBtn" class="btn" type="button"><svg class="ico"><use href="#i-restart"/></svg><span>再来一次</span></button>
  </div>
</div>

<!-- 教学提示卡（目前只有第 1 关用；内容在 levels.js 的 teach 里，触发时机见 game.js 的 pickTeachCards）。
     它一出现整局就暂停（game.js 循环里的 paused 分支），必须点按钮关掉才继续。
     样式没有另起一套：纸面板 + 角印 + 落印动效（.overlay.shake → .panel::after 的 sealBleed）
     全部沿用失败面板那一套，只是把文案和按钮换掉。 -->
<div id="teachOverlay" class="overlay hidden shake">
  <div class="panel">
    <div class="title" id="teachTitle">教学</div>
    <div id="teachLines"></div>
    <div class="hint" id="teachHint"></div>
    <button id="teachBtn" class="btn" type="button">知道了</button>
  </div>
</div>

<!-- 选关界面 -->
<div id="selectOverlay" class="overlay hidden">
  <div class="panel wide">
    <div class="title">选择关卡</div>
    <div class="hint">通关一关才会解锁下一关</div>
    <div id="levelList" class="level-list"></div>
    <button id="selectClose" class="btn small ghost" type="button"><svg class="ico"><use href="#i-close"/></svg><span>返回</span></button>
  </div>
</div>

<!-- 视频小窗 -->
<div id="videoOverlay" class="overlay hidden">
  <div class="popup" id="popup">
    <div class="popup-title" id="popupDrag">全部通关</div>
    <button class="popup-close" id="popupClose" type="button" aria-label="关闭"><svg class="ico"><use href="#i-close"/></svg></button>
    <div class="video-wrap">
      <video id="winVideo" src="assets/video_20261012_175751.mp4" controls playsinline preload="auto"></video>
      <div id="playHint" class="hidden"><svg class="ico solid"><use href="#i-play"/></svg><span>点击播放</span></div>
    </div>
    <div class="popup-actions">
      <button id="replayBtn" class="btn small" type="button"><svg class="ico"><use href="#i-restart"/></svg><span>从头开始</span></button>
    </div>
  </div>
</div>

<!-- 竖屏提示（只在「触屏 + 竖屏」时盖在最上层） -->
<div id="rotateOverlay">
  <div class="rot-icon"><svg class="ico"><use href="#i-phone"/></svg></div>
  <div class="rot-text">请把手机横过来</div>
  <div class="rot-sub">这个游戏是 16:9 横向的，横屏才有足够的操作空间</div>
  <button id="portraitPlay" class="rot-play" type="button">仍要竖屏玩</button>
</div>

<script src="lib/matter.min.js"></script>
<!-- 关卡数据（纯数据，改木块摆放只动这个文件；必须排在 game.js 前面） -->
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
